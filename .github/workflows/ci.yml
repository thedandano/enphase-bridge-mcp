name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ["v*"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Lockfile up to date (uv lock --check)
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Security lint (bandit)
        run: uv run bandit -r src

      - name: Export locked requirements
        run: uv export --no-emit-project --format requirements-txt > requirements.lock.txt

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit -r requirements.lock.txt

      - name: Unit tests (with coverage gate)
        run: uv run pytest tests/unit --cov=src/enphase_bridge_mcp --cov-fail-under=80

      - name: Integration tests
        run: uv run pytest tests/integration

      - name: BDD tests (behave)
        run: uv run behave
