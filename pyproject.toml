[project]
name = "enphase-bridge-mcp"
version = "1.1.0"
description = "MCP server bridging LLM tool calls to the local enphase-bridge Rust service"
readme = "README.md"
authors = [
    { name = "Dan Sedano", email = "47065799+thedandano@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]==2.0.0b1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
enphase-bridge-mcp = "enphase_bridge_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "behave>=1.3.3",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "C901"]
"features/**" = ["PLR0915", "C901"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
